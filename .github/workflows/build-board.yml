#
# Reusable job: build one board in the build container and upload
# dist/<board>_<version>[_open].bin (full SPI image padded to 8 MiB) as an
# artifact.

name: Build board

on:
  workflow_call:
    inputs:
      board:
        type: string
        required: true
      version:
        type: string
        required: true
      target:
        type: string
        default: RELEASE
      runner:
        type: string
        default: ubuntu-24.04-arm
      open:
        description: build bootloader2 (TF-A + OP-TEE) from source (--open)
        type: boolean
        default: false

jobs:
  build:
    name: ${{ inputs.board }}${{ inputs.open && ' (open)' || '' }}
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Container tag
        id: tag
        run: echo "tag=$(sha256sum docker/Dockerfile | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build container
        uses: docker/build-push-action@v7
        with:
          context: docker
          load: true
          tags: edk2-cix-build:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=edk2-cix-build-${{ runner.arch }}
          cache-to: type=gha,mode=max,scope=edk2-cix-build-${{ runner.arch }}

      - name: Cache vendor downloads
        uses: actions/cache@v6
        with:
          path: blobs-cache/git
          key: blobs-${{ hashFiles('manifests/blobs/*.json', 'manifests/cix-keys.json') }}

      - name: Build
        run: |
          ./build.sh "${{ inputs.board }}" --target "${{ inputs.target }}" \
            --version "${{ inputs.version }}" ${{ inputs.open && '--open' || '' }}

      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ inputs.board }}${{ inputs.open && '-open' || '' }}
          path: dist/*.bin
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: log-${{ inputs.board }}${{ inputs.open && '-open' || '' }}
          path: output/${{ inputs.board }}/*/build.log
          if-no-files-found: ignore
