# SPDX-License-Identifier: BSD-2-Clause-Patent
#
# Build check for pushes and pull requests. Changes that only touch
# documentation do not start it.

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - LICENSE
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Script syntax
        run: python3 -m py_compile scripts/*.py scripts/extract/*.py scripts/acpi/*.py scripts/open/*.py
      - name: Open tools
        run: python3 scripts/open/test_cixfw.py
      - name: Import manifest
        run: python3 scripts/imports.py --check
      - name: Patch queue applies
        run: |
          release=$(python3 -c 'import json; print(json.load(open("manifests/pins.json"))["bios_version"])')
          for sub in edk2 edk2-platforms arm-trusted-firmware optee_os; do
            for p in patches/$release/$sub/*.patch; do
              [ -e "$p" ] || continue
              git -C $sub apply --check --whitespace=nowarn "../$p" || exit 1
              git -C $sub apply --whitespace=nowarn "../$p"
            done
          done

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        board: [orion-o6, orion-o6n, ms-r1, opi6plus, opi6]
    uses: ./.github/workflows/build-board.yml
    with:
      board: ${{ matrix.board }}
      version: ci-${{ github.run_number }}

  # bootloader2 (TF-A BL31 + OP-TEE) from source, for the boards on the CIX
  # signing chain (docs/open-firmware.md)
  build-open:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        board: [orion-o6, orion-o6n]
    uses: ./.github/workflows/build-board.yml
    with:
      board: ${{ matrix.board }}
      version: ci-${{ github.run_number }}
      open: true
