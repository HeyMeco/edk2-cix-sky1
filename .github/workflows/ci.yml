#
# Build check for pushes and pull requests. Changes that only touch
# documentation do not start it.

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - LICENSE
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Script syntax
        run: python3 -m py_compile scripts/*.py scripts/extract/*.py scripts/acpi/*.py
      - name: Import manifest
        run: python3 scripts/imports.py --check
      - name: Patch queue applies
        run: |
          release=$(python3 -c 'import json; print(json.load(open("manifests/pins.json"))["bios_version"])')
          for p in patches/$release/edk2-platforms/*.patch; do
            git -C edk2-platforms apply --check --whitespace=nowarn "../$p" || exit 1
            git -C edk2-platforms apply --whitespace=nowarn "../$p"
          done

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        board: [orion-o6, orion-o6n, ms-r1, opi6plus, opi6]
    uses: ./.github/workflows/build-board.yml
    with:
      board: ${{ matrix.board }}
      version: ci-${{ github.run_number }}
